name: drinkopedia
description: Drinkopedia — a Flutter application.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

# Dependencies specify other packages that your package needs in order to work.
# To see which dependencies have newer versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  flutter_secure_storage: ^11.0.0
  provider: ^6.1.5+1
  go_router: ^18.0.1
  intl: ^0.20.2
  dio: ^5.11.1
  dartz: ^0.10.1
  flutter_screenutil: ^5.9.3
  cached_network_image: ^4.0.0
  flutter_svg: ^2.3.0
  drift: ^2.34.4
  path: ^1.9.1
  path_provider: ^2.1.6
  equatable: ^2.1.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.6
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.9
  json_serializable: ^6.14.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # Generates AppLocalizations from the .arb files in lib/l10n (see l10n.yaml).
  generate: true

  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/images/svg/
    - assets/data/

  fonts:
    - family: Rota
      fonts:
        - asset: assets/fonts/Rota-Thin.otf
          weight: 100
        - asset: assets/fonts/Rota-ThinItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/Rota-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Rota-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/Rota-Light.otf
          weight: 300
        - asset: assets/fonts/Rota-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Rota-Regular.otf
          weight: 400
        - asset: assets/fonts/Rota-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Rota-Medium.otf
          weight: 500
        - asset: assets/fonts/Rota-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Rota-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Rota-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Rota-Bold.otf
          weight: 700
        - asset: assets/fonts/Rota-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Rota-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Rota-ExtraBoldItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/Rota-Black.otf
          weight: 900
        - asset: assets/fonts/Rota-BlackItalic.otf
          weight: 900
          style: italic
    # Rota ExtraBlack is heavier than Black (900), which is the maximum weight
    # Flutter supports, so it is registered as its own family.
    - family: Rota ExtraBlack
      fonts:
        - asset: assets/fonts/Rota-ExtraBlack.otf
        - asset: assets/fonts/Rota-ExtraBlackItalic.otf
          style: italic
