# Builds a signed Android App Bundle and uploads it to Play Console.
#
# Triggered by a version tag on `main`, which is the only branch releases come
# from (docs/branching-strategy.md). It uploads to the **internal testing**
# track and never to production: promoting a build to real users stays a
# deliberate click in Play Console.
#
# Secrets this needs — see docs/release-pipeline.md for how to create them:
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its store password
#   ANDROID_KEY_PASSWORD        the key's own password
#   ANDROID_KEY_ALIAS           the key alias (e.g. upload)
#   COCKTAILDB_KEY              the premium TheCocktailDB key
#   PLAY_SERVICE_ACCOUNT_JSON   a Play Developer API service-account key
name: Release (Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true
      track:
        description: "Play track to upload to"
        default: internal
        type: choice
        options: [internal, alpha, beta]

permissions:
  # write, because a successful release records its version back on main.
  contents: write

# One release at a time: two uploads racing would fight over version codes.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The release guard below compares this commit against main, which
          # needs more than the default single-commit checkout.
          fetch-depth: 0

      - name: Check the required secrets are set
        env:
          REQUIRED: >-
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD
            ANDROID_KEY_ALIAS COCKTAILDB_KEY PLAY_SERVICE_ACCOUNT_JSON
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COCKTAILDB_KEY: ${{ secrets.COCKTAILDB_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Failing here beats failing two minutes into a build, and beats
          # shipping a bundle built with an empty API key.
          missing=
          for name in $REQUIRED; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Work out the version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_VERSION" ]; then
            name="$DISPATCH_VERSION"
          else
            name="${GITHUB_REF_NAME#v}"
          fi
          echo "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Version must look like 1.0.1, got '$name'"; exit 1; }

          # The build number is whatever pubspec carries, plus one. Play
          # refuses a build number it has already seen, so this has to rise
          # every time — which is why a successful release writes the new
          # number back to main at the end of this job. If that write is ever
          # skipped, the next release would reuse the number and be rejected.
          current=$(grep -m1 '^version:' pubspec.yaml | tr -d '[:space:]')
          current="${current##*+}"
          echo "$current" | grep -Eq '^[0-9]+$' || {
            echo "::error::No build number in pubspec.yaml's version line"; exit 1; }

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((current + 1))" >> "$GITHUB_OUTPUT"
          echo "Releasing $name, build $((current + 1)) (was $current)"

      - name: Check the commit is on main
        run: |
          # `main` is release-only. Without this, tagging any branch would ship it.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not on main — release from main only"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Nothing compiles before codegen: retrofit clients, drift tables, JSON
      # serialisation and typed routes are all generated and gitignored.
      - name: Generate code
        run: dart run build_runner build

      # The same gate as every PR. A tag can point at a commit CI never saw
      # green, and a broken build must not reach even internal testers.
      - name: Analyze project source
        run: flutter analyze

      # See the note in dart.yml: retries only a corrupted sqlite3 download.
      - name: Run tests
        run: .github/scripts/with-native-asset-retry.sh flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # android/build.gradle.kts reads this file and falls back to the
          # debug key when it is absent — which Play rejects, so a silent
          # fallback would waste an upload rather than ship something unsigned.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$keystore" \
            > android/key.properties

      - name: Build the app bundle and the APK
        env:
          COCKTAILDB_KEY: ${{ secrets.COCKTAILDB_KEY }}
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          # The bundle is what Play takes. The APK is for installing directly
          # — a tester on a device, or a quick check without Play in the way.
          for target in appbundle apk; do
            .github/scripts/with-native-asset-retry.sh \
              flutter build "$target" --release \
                --build-name="$BUILD_NAME" \
                --build-number="$BUILD_CODE" \
                --dart-define=COCKTAILDB_KEY="$COCKTAILDB_KEY"
          done

      - name: Confirm both are signed with the upload key, not the debug key
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk

          # The two need different tools. The bundle carries a JAR signature,
          # which keytool reads. The APK does not: with minSdk 24, Gradle
          # signs it with APK Signature Scheme v2 and leaves v1 off, so
          # keytool prints nothing at all for it — which would reject a
          # perfectly well-signed APK and fail every release. apksigner is the
          # tool that understands v2.
          apksigner=$(ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found — refusing to upload an APK whose signature cannot be checked"
            exit 1
          fi

          bundle_owner=$(keytool -printcert -jarfile "$bundle" | sed -n 's/^Owner: //p' | head -1)
          # apksigner has printed this line as both "Signer #1 certificate DN"
          # and "V2 Signer: certificate DN" across build-tools versions.
          "$apksigner" verify "$apk"
          apk_owner=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate DN: //p' | head -1)

          echo "bundle signed by: $bundle_owner"
          echo "APK signed by:    $apk_owner"

          # Play rejects a debug-signed upload; catching it here says why.
          for owner in "$bundle_owner" "$apk_owner"; do
            case "$owner" in
              *"Android Debug"*|"")
                echo "::error::An artifact is debug-signed or unsigned"; exit 1 ;;
            esac
          done

      - name: Keep the bundle and the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: drinkopedia-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.drinkopedia.app
          # The bundle only. Play requires an app bundle for apps published
          # since 2021 and will not take the APK, which is here for installing
          # directly instead.
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Internal testing only. Promoting to production stays a human
          # decision in Play Console, and production needs the closed-test
          # requirement met first anyway.
          track: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Record the released version on main
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          # Last, and only once the upload has succeeded: the build number is
          # spent the moment Play accepts it, and recording one that never
          # shipped would skip a number for no reason.
          #
          # This is the one place anything is pushed to a protected-by-
          # convention branch. [skip ci] keeps it from starting a second run,
          # and the release workflow itself only answers to tags, so this
          # cannot loop.
          git fetch --no-tags origin main
          git switch --force-create main origin/main

          sed -i -E "s/^version: .*/version: ${BUILD_NAME}+${BUILD_CODE}/" pubspec.yaml
          if git diff --quiet -- pubspec.yaml; then
            echo "pubspec.yaml already reads ${BUILD_NAME}+${BUILD_CODE}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release v${BUILD_NAME} (build ${BUILD_CODE}) [skip ci]" -- pubspec.yaml
          # A failure here must be loud: without it the next release reuses
          # this build number and Play rejects the upload.
          git push origin main

      - name: Publish the build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          tag="v${BUILD_NAME}"

          # Both build outputs are called app-release, which says nothing once
          # downloaded. Name them after what they are.
          aab="drinkopedia-${BUILD_NAME}-${BUILD_CODE}.aab"
          apk="drinkopedia-${BUILD_NAME}-${BUILD_CODE}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"

          notes=$(printf '%s\n\n%s' \
            "Uploaded to Play internal testing as build ${BUILD_CODE}." \
            "The APK installs straight onto a device. The bundle is what Play takes.")

          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run, or a release someone made by hand: attach to it
            # rather than failing on a name that already exists.
            gh release upload "$tag" "$aab" "$apk" --clobber
          else
            # On a tag run the tag already exists; on a manual run this
            # creates it, pinned to the commit that was actually built.
            gh release create "$tag" "$aab" "$apk" \
              --target "$GITHUB_SHA" \
              --title "Drinkopedia ${BUILD_NAME} (build ${BUILD_CODE})" \
              --notes "$notes" \
              --generate-notes
          fi

      - name: Remove the signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
