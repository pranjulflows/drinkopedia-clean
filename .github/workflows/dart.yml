name: CI

on:
  push:
    branches: [ "main", "development" ]
  # Almost every PR targets `development`, so watching only `main` would leave
  # the branch that receives all the work unchecked. See docs/branching-strategy.md.
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # This is a Flutter project, so the Flutter SDK is required — the Dart
      # SDK alone cannot resolve `flutter_test` or run widget tests.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Nothing compiles before codegen: retrofit clients, drift tables,
      # JSON serialisation and typed routes are all generated, and generated
      # files are gitignored. Without this step `flutter analyze` fails.
      - name: Generate code
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project source
        run: flutter analyze

      # Wrapped because package:sqlite3 downloads a prebuilt libsqlite3 here
      # and GitHub's runners intermittently hand back a corrupted copy. Only
      # that failure is retried; a real test failure still fails at once.
      - name: Run tests
        run: .github/scripts/with-native-asset-retry.sh flutter test
